# Simulated borrowers for the Stress Test Lab.
#
# Each persona is tied to a fake borrower record in data/fake_borrowers.csv.
# For answers_as: borrower (and knows_identity not false), the simulator is also
# told the borrower's real year of birth and registered city from that record.
#
# Fields:
#   id, name, language       who picks up and how they speak (Hindi, English, Hinglish)
#   borrower_id              the account being called
#   answers_as               borrower, spouse, parent, sibling, colleague or stranger
#   preferred_language       optional override of the record's language for this call
#   hidden_facts             what is true; the simulator reveals these only when natural
#   behavior                 how they talk
#   expected_outcome         one or more acceptable outcomes
#   must_call / must_not_call  tools that must or must not be called
#   judges                   situational judges to run on top of the universal ones
#   must_pass                checks and judges that must pass for the persona to pass
#   critical                 compliance-critical; gets extra seeds when runs are rationed
#
# The suite clock is Wednesday 21 Oct 2026, 11:00 IST, so "Friday" means 23 Oct.

personas:

